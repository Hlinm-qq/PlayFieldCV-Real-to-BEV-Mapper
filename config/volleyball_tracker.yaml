# tracker_type: bytetrack
# track_high_thresh: 0.20    # confidence threshold for stage 1 association
# track_low_thresh: 0.05     # confidence threshold for stage 2 recovery
# new_track_thresh: 0.20     # Threshold required to spawn a brand new track
# track_buffer: 60           # Frames to remember a lost player (2 seconds at 30fps)
# match_thresh: 0.80         # IoU distance threshold for Kalman filter matching
# fuse_score: True           # Multiply classification score with IoU

# custom_botsort.yaml
tracker_type: botsort
track_high_thresh: 0.25      # confidence threshold for stage 1 association
track_low_thresh: 0.1        # Second-stage association threshold for low-confidence detections
new_track_thresh: 0.65       # Threshold required to spawn a brand new track
track_buffer: 60             # Frames to remember a lost player (2 seconds at 30fps)
match_thresh: 0.70           # IoU distance threshold for Kalman filter matching
fuse_score: True

# Camera Motion Compensation
gmc_method: sparseOptFlow

# Appearance Re-ID 
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False